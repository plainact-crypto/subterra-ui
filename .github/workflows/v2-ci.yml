name: SUBTERRA v2 deterministic tests
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'v2-engine.js'
      - 'v2-app.js'
      - 'index.html'
      - 'data/field-catalog-v2.json'
      - 'data/demo/NCSF_87_MH_Pipe56_Four_Rounds.json'
      - 'data/demo/NCSF_87_Manholes_Historical_Source.json'
      - 'data/demo/NCSF_103_Historical_Pipes_HOLDOUT.json'
      - 'v2.css'
      - 'tests/test-v2.js'
      - '.github/workflows/v2-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check v2-engine.js
          node --check v2-app.js
      - name: Run deterministic engineering tests
        run: node tests/test-v2.js
