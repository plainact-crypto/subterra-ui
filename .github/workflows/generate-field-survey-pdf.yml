name: Generate Arabic field-survey PDF
on:
  push:
    branches: [main]
    paths:
      - 'docs/field-survey-manual-ar.html'
      - 'scripts/build_field_manual.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arabic shaping fonts and PDF engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install --disable-pip-version-check weasyprint==68.0
      - name: Generate field survey PDF
        run: python scripts/build_field_manual.py
      - name: Commit PDF to the documentation folder for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SUBTERRA_Field_Survey_JSON_Manual_AR.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate Arabic field survey PDF [skip ci]"
            git push
          fi
